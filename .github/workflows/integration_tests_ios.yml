name: Integration Tests (iOS)

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/dependabot.yml'
      - '.github/workflows/flutter_build_example.yml'
      - '.github/workflows/flutter_checks.yml'
      - '.github/workflows/integration_tests_android.yml'
      - '.github/workflows/pub_publish.yml'
      - '.github/workflows/pub_publish_dry_run.yml'
      - '.github/workflows/pub_score.yml'
      - 'analysis_options.yaml'
      - 'android/**'
      - 'test/**'
      - 'example/analysis_options.yaml'
      - 'example/android/**'
      - 'example/test/**'
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/dependabot.yml'
      - '.github/workflows/flutter_build_example.yml'
      - '.github/workflows/flutter_checks.yml'
      - '.github/workflows/integration_tests_android.yml'
      - '.github/workflows/pub_publish.yml'
      - '.github/workflows/pub_publish_dry_run.yml'
      - '.github/workflows/pub_score.yml'
      - 'analysis_options.yaml'
      - 'android/**'
      - 'test/**'
      - 'example/analysis_options.yaml'
      - 'example/android/**'
      - 'example/test/**'

jobs:
  integration_test_ios:
    name: iOS ${{ matrix.package-manager }} ${{ matrix.os-version }} - ${{ matrix.model }}
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # https://github.com/futureware-tech/simulator-action/wiki/Devices-macos-latest
        package-manager: ['SwiftPM', 'CocoaPods']
        os-version: ['26.2']
        model: ['iPhone 17']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Flutter for SwiftPM
        if: matrix.package-manager == 'SwiftPM'
        run: |
          flutter config --no-analytics
          flutter config --enable-swift-package-manager

      - name: Configure Flutter for CocoaPods
        if: matrix.package-manager == 'CocoaPods'
        run: |
          flutter config --no-analytics
          flutter config --no-enable-swift-package-manager

      - name: Create integration test app
        run: |
          flutter create --platforms=ios --org io.achim \
            "$RUNNER_TEMP/haptic_feedback_integration"
          cd "$RUNNER_TEMP/haptic_feedback_integration"
          flutter pub add \
            "haptic_feedback@{path: $GITHUB_WORKSPACE}" \
            "dev:integration_test@{sdk: flutter}"
          mkdir -p integration_test
          cp "$GITHUB_WORKSPACE/example/integration_test/plugin_integration_test.dart" \
            integration_test/

      - name: Boot iOS simulator
        id: boot_simulator
        uses: futureware-tech/simulator-action@v5
        with:
          os_version: ${{ matrix.os-version }}
          model: ${{ matrix.model }}
          wait_for_boot: true
          shutdown_after_job: false

      - name: Run SwiftPM integration tests on iOS
        if: matrix.package-manager == 'SwiftPM'
        timeout-minutes: 20
        run: |
          cd "$RUNNER_TEMP/haptic_feedback_integration"
          [ ! -e ios/Podfile ]
          flutter test integration_test -d "${{ steps.boot_simulator.outputs.udid }}"
          [ ! -d ios/Pods ]

      - name: Run CocoaPods integration tests on iOS
        if: matrix.package-manager == 'CocoaPods'
        timeout-minutes: 20
        run: |
          cd "$RUNNER_TEMP/haptic_feedback_integration"
          [ -e ios/Podfile ]
          flutter test integration_test -d "${{ steps.boot_simulator.outputs.udid }}"
          [ -e ios/Podfile.lock ]
          [ -d ios/Pods ]

      - name: Run example native tests on iOS
        if: matrix.package-manager == 'SwiftPM'
        timeout-minutes: 10
        run: |
          cd example
          flutter pub get
          xcodebuild -quiet test \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=${{ steps.boot_simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
