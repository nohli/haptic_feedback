name: Integration Tests (iOS)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration_test_ios:
    name: iOS SwiftPM ${{ matrix.os-version }} - ${{ matrix.model }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # https://github.com/futureware-tech/simulator-action/wiki/Devices-macos-latest
        os-version: ['26.2']
        model: ['iPhone 17']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Flutter
        run: |
          flutter config --no-analytics
          flutter config --enable-swift-package-manager

      - name: Create SwiftPM test app
        run: |
          flutter create --platforms=ios --org io.achim \
            "$RUNNER_TEMP/haptic_feedback_spm"
          cd "$RUNNER_TEMP/haptic_feedback_spm"
          flutter pub add \
            "haptic_feedback@{path: $GITHUB_WORKSPACE}" \
            "dev:integration_test@{sdk: flutter}"
          mkdir -p integration_test
          cp "$GITHUB_WORKSPACE/example/integration_test/plugin_integration_test.dart" \
            integration_test/

      - name: Boot iOS simulator
        id: boot_simulator
        uses: futureware-tech/simulator-action@v5
        with:
          os_version: ${{ matrix.os-version }}
          model: ${{ matrix.model }}

      - name: Run integration tests on iOS
        run: |
          cd "$RUNNER_TEMP/haptic_feedback_spm"
          test ! -e ios/Podfile
          flutter test integration_test -d "${{ steps.boot_simulator.outputs.udid }}"
          test ! -d ios/Pods
